<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de Ocorrências - COI Energisa Tocantins</title>
<style>
:root{
  --navy-900:#0A1B2E;
  --navy-800:#0F2843;
  --navy-700:#173A5E;
  --ink:#16202B;
  --ink-60:#5A6874;
  --paper:#EEF1F5;
  --card:#FFFFFF;
  --line:#D3DBE4;
  --orange:#F07E1A;
  --orange-dk:#C96410;
  --green:#1B8A5A;
  --amber:#B07407;
  --mono:ui-monospace,"Cascadia Mono","Consolas","Menlo",monospace;
  --sans:"Segoe UI",Roboto,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}

/* ---------- cabeçalho ---------- */
header{
  background:var(--navy-900);
  border-bottom:3px solid var(--orange);
  padding:10px 18px;
  display:flex;
  align-items:baseline;
  gap:14px;
  flex-wrap:wrap;
}
header h1{
  font-size:15px;
  font-weight:600;
  color:#fff;
  letter-spacing:.06em;
  text-transform:uppercase;
}
header .sub{
  font-size:11px;
  color:#8FA6BD;
  letter-spacing:.08em;
  text-transform:uppercase;
}
header .rel{
  margin-left:auto;
  font-family:var(--mono);
  font-size:11px;
  color:#8FA6BD;
  letter-spacing:.04em;
}

/* ---------- estrutura ---------- */
main{
  display:grid;
  grid-template-columns:230px minmax(0,1fr) minmax(320px,440px);
  gap:14px;
  padding:14px;
  align-items:start;
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:3px;
}
.card > h2{
  font-size:11px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--ink-60);
  padding:9px 12px;
  border-bottom:1px solid var(--line);
}

/* ---------- navegação de padrões ---------- */
nav ul{list-style:none}
nav button{
  width:100%;
  display:flex;
  gap:9px;
  align-items:flex-start;
  text-align:left;
  background:none;
  border:0;
  border-bottom:1px solid var(--line);
  padding:10px 12px;
  font:inherit;
  font-size:13px;
  color:var(--ink);
  cursor:pointer;
  border-left:3px solid transparent;
}
nav li:last-child button{border-bottom:0}
nav button:hover{background:#F5F8FB}
nav button .num{
  font-family:var(--mono);
  font-size:11px;
  color:var(--ink-60);
  padding-top:2px;
  min-width:16px;
}
nav button[aria-current="true"]{
  background:#F0F5FA;
  border-left-color:var(--orange);
  font-weight:600;
}
nav button[aria-current="true"] .num{color:var(--orange-dk)}

/* ---------- formulário ---------- */
.form-head{
  padding:11px 14px;
  border-bottom:1px solid var(--line);
}
.form-head h2{
  font-size:14px;
  font-weight:600;
  color:var(--navy-800);
}
.form-head p{
  font-size:12px;
  color:var(--ink-60);
  margin-top:2px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 14px;
  padding:14px;
}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo.wide{grid-column:1 / -1}
.campo label{
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.07em;
  text-transform:uppercase;
  color:var(--ink-60);
}
input,select{
  font:inherit;
  font-size:13.5px;
  height:32px;
  padding:0 8px;
  border:1px solid var(--line);
  border-radius:2px;
  background:#FCFDFE;
  color:var(--ink);
  width:100%;
  min-width:0;
}
select{padding-left:5px;cursor:pointer}
input:hover,select:hover{border-color:#A8B6C4}
input:focus,select:focus{
  outline:2px solid var(--orange);
  outline-offset:-1px;
  border-color:var(--orange);
  background:#fff;
}
input.ok,select.ok{border-left:3px solid var(--green)}
.barra{
  display:flex;
  gap:8px;
  align-items:center;
  padding:10px 14px;
  border-top:1px solid var(--line);
  background:#F7F9FB;
  flex-wrap:wrap;
}
button.acao{
  font:inherit;
  font-size:12px;
  font-weight:600;
  letter-spacing:.04em;
  height:30px;
  padding:0 14px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);
  border-radius:2px;
  cursor:pointer;
}
button.acao:hover{background:#EDF1F5}
.dica{
  font-size:11px;
  color:var(--ink-60);
  font-family:var(--mono);
  margin-left:auto;
}

/* ---------- saída ---------- */
.saida-wrap{position:sticky;top:14px}
#saida{
  background:var(--navy-900);
  color:#C9D6E4;
  font-family:var(--mono);
  font-size:13px;
  line-height:1.75;
  padding:14px;
  min-height:190px;
  white-space:pre-wrap;
  word-break:break-word;
  border-bottom:1px solid var(--line);
}
#saida .val{color:#FFB05E;font-weight:600}
#saida .pend{
  color:#63788E;
  border-bottom:1px dashed #3C566E;
  cursor:pointer;
}
#saida .pend:hover{color:#9FB4C9}
.status{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  font-size:11.5px;
  font-family:var(--mono);
  color:var(--ink-60);
  border-bottom:1px solid var(--line);
  background:#F7F9FB;
}
.status .pt{color:var(--amber);font-weight:700}
.status .ok{color:var(--green);font-weight:700}
#copiar{
  display:block;
  width:100%;
  border:0;
  border-radius:0 0 2px 2px;
  background:var(--orange);
  color:#fff;
  font:inherit;
  font-size:13px;
  font-weight:700;
  letter-spacing:.09em;
  text-transform:uppercase;
  height:44px;
  cursor:pointer;
  transition:background .12s ease;
}
#copiar:hover{background:var(--orange-dk)}
#copiar.feito{background:var(--green)}
#copiar:focus-visible{outline:2px solid var(--navy-800);outline-offset:-3px}

footer{
  padding:6px 18px 18px;
  font-size:11px;
  color:var(--ink-60);
  letter-spacing:.03em;
}

@media (max-width:1100px){
  main{grid-template-columns:1fr}
  .saida-wrap{position:static}
  nav ul{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  nav button{border-bottom:1px solid var(--line)}
}
@media (max-width:640px){
  .grid{grid-template-columns:1fr}
  header .rel{width:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <h1>Gerador de Ocorrências</h1>
  <span class="sub">COI &bull; Energisa Tocantins</span>
  <span class="rel" id="relogio"></span>
</header>

<main>
  <nav class="card" aria-label="Padrões de ocorrência">
    <h2>Padrões</h2>
    <ul id="lista-padroes"></ul>
  </nav>

  <section class="card">
    <div class="form-head">
      <h2 id="titulo-padrao"></h2>
      <p id="desc-padrao"></p>
    </div>
    <div class="grid" id="grid-campos"></div>
    <div class="barra">
      <button class="acao" id="limpar" type="button">Limpar campos</button>
      <span class="dica">Alt+1..3 troca padrão &bull; Ctrl+Enter copia</span>
    </div>
  </section>

  <section class="card saida-wrap">
    <h2>Mensagem</h2>
    <div id="saida" aria-live="polite"></div>
    <div class="status" id="status"></div>
    <button id="copiar" type="button">Copiar mensagem</button>
  </section>
</main>

<footer>App desenvolvido por Rafael Pereira Marques</footer>

<script>
"use strict";

/* ====================================================================
   CAMPOS COMPARTILHADOS - preservados ao trocar de padrão
   ==================================================================== */
const CLIMA = ["Bom","Nublado","Chuva fraca","Chuva forte","Chuva com descargas atmosféricas","Vento forte","Tempo seco"];
const CAUSAS = ["Descarga atmosférica","Vegetação","Vento forte","Animal","Terceiros","Falha de equipamento","Queimada","Objeto sobre a rede","Indeterminada"];

const COMUNS = [
  {k:"rdr",   rot:"RDR / RDU",  tipo:"text",  ph:"XXXXX"},
  {k:"causa", rot:"Causa",      tipo:"lista", ph:"XXXXX", opcoes:CAUSAS},
  {k:"equipe",rot:"Equipe",     tipo:"text",  ph:"XXXXX"},
  {k:"clima", rot:"Clima",      tipo:"lista", ph:"XXXXX", opcoes:CLIMA},
  {k:"obs",   rot:"Observação (opcional)", tipo:"text", ph:"Em branco: linha não é incluída", opcional:true, largo:true}
];

/* formatadores de data e hora para a saída */
function FMT_DATAHORA(v){                 // 19/08/2026 08:32
  const a = v.split("T"); if (a.length < 2) return v;
  const d = a[0].split("-");
  return d[2] + "/" + d[1] + "/" + d[0] + " " + a[1].slice(0,5);
}
function FMT_DATAHORA_CURTA(v){           // 19/08/26 08:32
  const a = v.split("T"); if (a.length < 2) return v;
  const d = a[0].split("-");
  return d[2] + "/" + d[1] + "/" + d[0].slice(2) + " " + a[1].slice(0,5);
}

const PROTECOES = ["50","51","50N","51N","50/51","50N/51N","67","67N","46","27","59","81","79 - bloqueio","Sobrecorrente instantânea","Sobrecorrente temporizada"];

/* ====================================================================
   PADRÕES
   Template: texto livre + {chave} para os campos
   ==================================================================== */
const PADROES = [
  {
    id:"desarme",
    nome:"Desarme de DJ / Religador",
    desc:"Atuação de proteção com desligamento de alimentador ou religador de linha.",
    campos:[
      {k:"tipo",     rot:"Equipamento",       tipo:"select", ph:"RL/DJ", opcoes:["DJ","RL"]},
      {k:"nome",     rot:"Ativo",        tipo:"text",   ph:"XXXXX"},
      {k:"protecao", rot:"Proteção atuada",   tipo:"lista",  ph:"XXXXX", opcoes:PROTECOES},
      {k:"icc",      rot:"ICC",               tipo:"text",   ph:"XXXXX"}
    ],
    template:[
      "Desarme {tipo} {nome}",
      "Proteção atuada {protecao}",
      "ICC {icc}",
      "Penalizando cargas da RDR/RDU {rdr}",
      "Causa {causa}",
      "Equipe {equipe}",
      "Clima {clima}",
      "OBS: {obs}"
    ].join("\n")
  },
  {
    id:"elo",
    nome:"Queima de elo - Trafo / Chave",
    desc:"Atuação de elo fusível em transformador ou chave de derivação.",
    campos:[
      {k:"tipo", rot:"Equipamento", tipo:"select", ph:"TR/CH", opcoes:["TR","CH"]},
      {k:"nome", rot:"Ativo",  tipo:"text",   ph:"XXXXX"},
      {k:"fase", rot:"Fase",        tipo:"select", ph:"XXXXX", opcoes:["A","B","C","AB","AC","BC","ABC"]},
      {k:"eloret",  rot:"Elo retirado",  tipo:"lista", ph:"XXXXX", opcoes:["6K","10K","15K","25K","40K","65K","80K","100K","140K","200K"]},
      {k:"eloinst", rot:"Elo instalado", tipo:"lista", ph:"XXXXX", opcoes:["6K","10K","15K","25K","40K","65K","80K","100K","140K","200K"]}
    ],
    derivados:{
      artigo:v => v.tipo === "CH" ? "na" : (v.tipo === "TR" ? "no" : "no(a)")
    },
    template:[
      "Queima de elo {artigo} {tipo} {nome}",
      "Fase {fase} Elo Retirado {eloret} Elo Instalado {eloinst}",
      "Penalizando cargas da RDR/RDU {rdr}",
      "Causa {causa}",
      "Equipe {equipe}",
      "Clima {clima}",
      "OBS: {obs}"
    ].join("\n")
  },
  {
    id:"emergencial",
    nome:"Abertura emergencial",
    desc:"Manobra emergencial por situação de risco em campo.",
    campos:[
      {k:"tipo",  rot:"Equipamento",       tipo:"select", ph:"DJ/RL/TR/CH", opcoes:["DJ","RL","TR","CH"]},
      {k:"nome",  rot:"Ativo",        tipo:"text",   ph:"XXXXX"},
      {k:"risco", rot:"Situação de risco", tipo:"lista",  ph:"XXXXX", largo:true,
       opcoes:["Condutor rompido ao solo","Poste abalroado","Poste danificado","Incêndio próximo à rede","Vazamento de óleo em transformador","Rede com risco de contato","Solicitação de equipe em campo","Acidente com terceiros"]}
    ],
    template:[
      "Abertura emergencial {tipo} {nome}",
      "Devido situação de risco: {risco}",
      "Penalizando cargas da RDR/RDU {rdr}",
      "Causa {causa}",
      "Equipe {equipe}",
      "Clima {clima}",
      "OBS: {obs}"
    ].join("\n")
  },
  {
    id:"cos",
    nome:"Ocorrência em subestação - COS",
    desc:"Comunicado de desarme de disjuntor de transformador de subestação.",
    comuns:["causa","obs"],
    campos:[
      {k:"regional",   rot:"Regional",            tipo:"lista",  ph:"XXXX",    opcoes:["Norte","Centro","Sul"]},
      {k:"dj",         rot:"DJ",                  tipo:"text",   ph:"XXX"},
      {k:"nivel",      rot:"Lado",                tipo:"select", ph:"Alta/Baixa", opcoes:["Alta","Baixa"]},
      {k:"trafo",      rot:"Trafo (kV)",          tipo:"text",   ph:"XXX/XXX"},
      {k:"se",         rot:"Subestação",          tipo:"text",   ph:"XXXX"},
      {k:"unidades",   rot:"Unidades afetadas",   tipo:"text",   ph:"X.XXX"},
      {k:"protecao",   rot:"Proteção",            tipo:"lista",  ph:"XXX",     opcoes:PROTECOES},
      {k:"hini",       rot:"Horário inicial",     tipo:"hora",   ph:"XX:XX:XX"},
      {k:"hfim",       rot:"Horário final",       tipo:"hora",   ph:"XX:XX:XX"},
      {k:"municipios", rot:"Municípios afetados", tipo:"text",   ph:"XXX", largo:true}
    ],
    template:[
      "Empresa: ETO",
      "Abrangência: Regional {regional}",
      "",
      "Denominação: Desarme DJ {dj} ({nivel}) do Trafo {trafo} kV SE {se}.",
      "Unidades Afetados: {unidades}",
      "Proteção: {protecao}",
      "Horário Inicial: {hini}",
      "Horário final: {hfim}",
      "Causa: {causa}",
      "Municípios afetados: {municipios}",
      "OBS: {obs}"
    ].join("\n")
  },
  {
    id:"distribuicao",
    nome:"Ocorrência em andamento - Distribuição",
    desc:"Comunicado de ocorrência em andamento na distribuição, por polo.",
    comuns:["causa","equipe","obs"],
    campos:[
      {k:"polo",     rot:"Polo",                  tipo:"text",     ph:"XXXX"},
      {k:"local",    rot:"Local",                 tipo:"text",     ph:"XXXX"},
      {k:"elemento", rot:"Elemento desarmado",    tipo:"text",     ph:"XXXX"},
      {k:"interv",   rot:"Interv / O.S.",         tipo:"text",     ph:"XXXX"},
      {k:"inicio",   rot:"Horário de início",     tipo:"datahora", ph:"XX/XX/XX XX:XX",
       fmt:FMT_DATAHORA_CURTA},
      {k:"clientes", rot:"Clientes interrompidos",tipo:"text",     ph:"XXX"},
      {k:"icc",      rot:"ICC",                   tipo:"text",     ph:"XXX"},
      {k:"protecoes",rot:"Proteções",             tipo:"lista",    ph:"XXX", opcoes:PROTECOES},
      {k:"cidades",  rot:"Cidades afetadas",      tipo:"text",     ph:"XXX", largo:true},
      {k:"nix",      rot:"Nix assertivo",         tipo:"lista",    ph:"XXX", opcoes:["Sim","Não","Parcial"]}
    ],
    template:[
      "Ocorrência em Andamento Polo {polo}",
      "",
      "Local: {local}",
      "Elemento desarmado: {elemento}",
      "Interv/O.S: {interv}",
      "Horário de Início: {inicio}",
      "Quantidade de Clientes Interrompidos: {clientes} UC(s)",
      "ICC: {icc}",
      "Proteções: {protecoes}",
      "Causa: {causa}",
      "Equipe: {equipe}",
      "Cidades afetadas: {cidades}",
      "Nix Assertivo: {nix}",
      "Observação: {obs}"
    ].join("\n")
  },
  {
    id:"atualizacao",
    nome:"Atualização de ocorrência - Distribuição",
    desc:"Atualização parcial ou final de ocorrência em andamento na distribuição.",
    comuns:["obs"],
    campos:[
      {k:"polo",         rot:"Polo",                     tipo:"text",     ph:"XXXX"},
      {k:"local",        rot:"Local",                    tipo:"text",     ph:"XXX"},
      {k:"elemento",     rot:"Elemento desarmado",       tipo:"text",     ph:"XXXX"},
      {k:"interv",       rot:"Interv / O.S.",            tipo:"text",     ph:"XXXX"},
      {k:"inicio",       rot:"Horário de início",        tipo:"datahora", ph:"XX/XX/XXXX XX:XX", fmt:FMT_DATAHORA},
      {k:"parcial",      rot:"Horário da parcial",       tipo:"datahora", ph:"XX/XX/XXXX XX:XX", fmt:FMT_DATAHORA},
      {k:"normalizados", rot:"Clientes normalizados",    tipo:"text",     ph:"XXX"},
      {k:"interrompidos",rot:"Clientes interrompidos",   tipo:"text",     ph:"XXX"},
      {k:"nix",          rot:"Nix assertivo",            tipo:"lista",    ph:"XXX", opcoes:["Sim","Não","Parcial"]}
    ],
    template:[
      "Atualização de Ocorrência em Andamento Polo {polo}",
      "",
      "Local: {local}",
      "Elemento desarmado: {elemento}",
      "Interv/O.S: {interv}",
      "Horário de Início: {inicio}",
      "Horário da Parcial: {parcial}",
      "Quantidade de clientes normalizados: {normalizados} UC(s)",
      "Quantidade de Clientes Interrompidos: {interrompidos} UC(s)",
      "Nix Assertivo: {nix}",
      "OBS: {obs}"
    ].join("\n")
  },
  {
    id:"final",
    nome:"Atualização final - Distribuição",
    desc:"Encerramento de ocorrência na distribuição, com horário final e causa.",
    comuns:["causa","obs"],
    campos:[
      {k:"polo",     rot:"Polo",              tipo:"text",     ph:"XXXX"},
      {k:"local",    rot:"Local",             tipo:"text",     ph:"XXX"},
      {k:"elemento", rot:"Elemento desarmado",tipo:"text",     ph:"XXXX"},
      {k:"interv",   rot:"Interv / O.S.",     tipo:"text",     ph:"XXXX"},
      {k:"inicio",   rot:"Horário de início", tipo:"datahora", ph:"XX/XX/XXXX XX:XX", fmt:FMT_DATAHORA},
      {k:"fim",      rot:"Horário final",     tipo:"datahora", ph:"XX/XX/XXXX XX:XX", fmt:FMT_DATAHORA},
      {k:"nix",      rot:"Nix assertivo",     tipo:"lista",    ph:"XXX", opcoes:["Sim","Não","Parcial"]}
    ],
    template:[
      "Atualização de Ocorrência Polo {polo}",
      "",
      "Local: {local}",
      "Elemento desarmado: {elemento}",
      "Interv/O.S: {interv}",
      "Horário de Início: {inicio}",
      "Horário Final: {fim}",
      "Nix Assertivo: {nix}",
      "Causa: {causa}",
      "Observação: {obs}"
    ].join("\n")
  }
];

PADROES.forEach(p => {
  const usa = p.comuns || COMUNS.map(c => c.k);
  p.todos = p.campos.concat(COMUNS.filter(c => usa.indexOf(c.k) >= 0));
});

/* ====================================================================
   ESTADO
   ==================================================================== */
const valores = {};              // valores por padrão: valores[idPadrao][chave]
const compartilhado = {};        // rdr / causa / equipe / clima
let atual = PADROES[0];

PADROES.forEach(p => { valores[p.id] = {}; });
const CHAVES_COMUNS = COMUNS.map(c => c.k);

function get(k){
  return (CHAVES_COMUNS.indexOf(k) >= 0 ? compartilhado[k] : valores[atual.id][k]) || "";
}
function set(k,v){
  if (CHAVES_COMUNS.indexOf(k) >= 0) compartilhado[k] = v;
  else valores[atual.id][k] = v;
}

/* ====================================================================
   NAVEGAÇÃO
   ==================================================================== */
const lista = document.getElementById("lista-padroes");
PADROES.forEach((p,i) => {
  const li = document.createElement("li");
  const b  = document.createElement("button");
  b.type = "button";
  b.innerHTML = '<span class="num">' + String(i+1).padStart(2,"0") + '</span><span>' + p.nome + '</span>';
  b.onclick = () => selecionar(p);
  li.appendChild(b);
  lista.appendChild(li);
  p._btn = b;
});

function selecionar(p){
  atual = p;
  PADROES.forEach(x => x._btn.setAttribute("aria-current", x === p ? "true" : "false"));
  document.getElementById("titulo-padrao").textContent = p.nome;
  document.getElementById("desc-padrao").textContent   = p.desc;
  montarCampos();
  render();
}

/* ====================================================================
   FORMULÁRIO
   ==================================================================== */
const grid = document.getElementById("grid-campos");
const refs = {};

function montarCampos(){
  grid.innerHTML = "";
  for (const k in refs) delete refs[k];

  atual.todos.forEach(c => {
    const box = document.createElement("div");
    box.className = "campo" + (c.largo ? " wide" : "");

    const id  = "f_" + c.k;
    const lab = document.createElement("label");
    lab.textContent = c.rot;
    lab.setAttribute("for", id);
    box.appendChild(lab);

    let el;
    if (c.tipo === "select"){
      el = document.createElement("select");
      const vazio = document.createElement("option");
      vazio.value = "";
      vazio.textContent = "-- selecionar --";
      el.appendChild(vazio);
      c.opcoes.forEach(o => {
        const op = document.createElement("option");
        op.value = o; op.textContent = o;
        el.appendChild(op);
      });
    } else if (c.tipo === "hora" || c.tipo === "datahora"){
      el = document.createElement("input");
      el.type = (c.tipo === "hora") ? "time" : "datetime-local";
      if (c.tipo === "hora") el.step = "1";
    } else {
      el = document.createElement("input");
      el.type = "text";
      el.autocomplete = "off";
      el.placeholder = c.ph;
      if (c.tipo === "lista"){
        const dl = document.createElement("datalist");
        dl.id = "dl_" + c.k;
        c.opcoes.forEach(o => {
          const op = document.createElement("option");
          op.value = o;
          dl.appendChild(op);
        });
        box.appendChild(dl);
        el.setAttribute("list", dl.id);
      }
    }

    el.id = id;
    el.value = get(c.k);
    el.addEventListener("input", () => { set(c.k, el.value.trim()); render(); });
    el.addEventListener("change", () => { set(c.k, el.value.trim()); render(); });

    box.appendChild(el);
    grid.appendChild(box);
    refs[c.k] = el;
  });
}

/* ====================================================================
   MONTAGEM DA MENSAGEM
   ==================================================================== */
function contexto(){
  const v = {};
  atual.todos.forEach(c => {
    const bruto = get(c.k);
    v[c.k] = (c.fmt && bruto) ? c.fmt(bruto) : bruto;
  });
  if (atual.derivados){
    for (const d in atual.derivados) v[d] = atual.derivados[d](v);
  }
  return v;
}

function corpo(v){
  // remove a linha inteira quando o campo opcional daquela linha está vazio
  return atual.template.split("\n").filter(linha => {
    const marcas = linha.match(/\{([a-zA-Z]+)\}/g) || [];
    return !marcas.some(m => {
      const chave = m.slice(1,-1);
      const campo = atual.todos.find(c => c.k === chave);
      return campo && campo.opcional && !v[chave];
    });
  }).join("\n");
}

function segmentos(){
  const v = contexto();
  const partes = corpo(v).split(/(\{[a-zA-Z]+\})/g);
  return partes.filter(s => s !== "").map(s => {
    const m = s.match(/^\{([a-zA-Z]+)\}$/);
    if (!m) return {tipo:"texto", txt:s};
    const chave = m[1];
    const campo = atual.todos.find(c => c.k === chave);
    if (!campo) return {tipo:"texto", txt:v[chave] || ""};      // derivado
    return {
      tipo: v[chave] ? "valor" : "pendente",
      txt : v[chave] || campo.ph,
      k   : chave,
      rot : campo.rot
    };
  });
}

const saida  = document.getElementById("saida");
const status = document.getElementById("status");
const btnCopiar = document.getElementById("copiar");

function render(){
  const segs = segmentos();
  saida.innerHTML = "";
  let pendentes = 0;

  segs.forEach(s => {
    if (s.tipo === "texto"){
      saida.appendChild(document.createTextNode(s.txt));
      return;
    }
    const sp = document.createElement("span");
    sp.textContent = s.txt;
    if (s.tipo === "valor"){
      sp.className = "val";
    } else {
      sp.className = "pend";
      sp.title = "Preencher: " + s.rot;
      sp.onclick = () => { if (refs[s.k]) refs[s.k].focus(); };
      pendentes++;
    }
    saida.appendChild(sp);
  });

  atual.todos.forEach(c => {
    if (refs[c.k]) refs[c.k].classList.toggle("ok", !!get(c.k));
  });

  status.innerHTML = pendentes === 0
    ? '<span class="ok">COMPLETO</span> Todos os campos preenchidos.'
    : '<span class="pt">' + pendentes + ' PENDENTE' + (pendentes>1?"S":"") + '</span> Clique no campo em destaque para preencher.';

  btnCopiar.classList.remove("feito");
  btnCopiar.textContent = "Copiar mensagem";
}

function texto(){
  return segmentos().map(s => s.txt).join("");
}

/* ====================================================================
   CÓPIA
   ==================================================================== */
function copiar(){
  const t = texto();
  const feito = () => {
    btnCopiar.classList.add("feito");
    btnCopiar.textContent = "Mensagem copiada";
    setTimeout(() => {
      btnCopiar.classList.remove("feito");
      btnCopiar.textContent = "Copiar mensagem";
    }, 1600);
  };
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(feito).catch(() => legado(t, feito));
  } else {
    legado(t, feito);
  }
}
function legado(t, ok){
  const ta = document.createElement("textarea");
  ta.value = t;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); ok(); } catch(e){ ta.remove(); return; }
  ta.remove();
}
btnCopiar.onclick = copiar;

document.getElementById("limpar").onclick = () => {
  atual.todos.forEach(c => set(c.k, ""));
  montarCampos();
  render();
  const p = atual.todos[0];
  if (refs[p.k]) refs[p.k].focus();
};

/* ====================================================================
   ATALHOS E RELÓGIO
   ==================================================================== */
document.addEventListener("keydown", e => {
  if (e.ctrlKey && e.key === "Enter"){ e.preventDefault(); copiar(); return; }
  if (e.altKey && !e.ctrlKey){
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= PADROES.length){ e.preventDefault(); selecionar(PADROES[n-1]); }
  }
});

function relogio(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  document.getElementById("relogio").textContent =
    p(d.getDate()) + "/" + p(d.getMonth()+1) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
relogio();
setInterval(relogio, 20000);

selecionar(PADROES[0]);
</script>
