<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de Ocorrências - COI Energisa Tocantins</title>
<style>

:root{
  --navy-900:#0A1B2E;
  --navy-800:#0F2843;
  --navy-700:#173A5E;
  --ink:#16202B;
  --ink-60:#5A6874;
  --paper:#EEF1F5;
  --card:#FFFFFF;
  --line:#D3DBE4;
  --orange:#F07E1A;
  --orange-dk:#C96410;
  --green:#1B8A5A;
  --amber:#B07407;
  --mono:ui-monospace,"Cascadia Mono","Consolas","Menlo",monospace;
  --sans:"Segoe UI",Roboto,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}

/* ---------- cabeçalho ---------- */
header{
  background:var(--navy-900);
  border-bottom:3px solid var(--orange);
  padding:10px 18px;
  display:flex;
  align-items:baseline;
  gap:14px;
  flex-wrap:wrap;
}
header h1{
  font-size:15px;
  font-weight:600;
  color:#fff;
  letter-spacing:.06em;
  text-transform:uppercase;
}
header .sub{
  font-size:11px;
  color:#8FA6BD;
  letter-spacing:.08em;
  text-transform:uppercase;
}
header .rel{
  margin-left:auto;
  font-family:var(--mono);
  font-size:11px;
  color:#8FA6BD;
  letter-spacing:.04em;
}

/* ---------- estrutura ---------- */
main{
  display:grid;
  grid-template-columns:230px minmax(0,1fr) minmax(320px,440px);
  gap:14px;
  padding:14px;
  align-items:start;
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:3px;
}
.card > h2{
  font-size:11px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--ink-60);
  padding:9px 12px;
  border-bottom:1px solid var(--line);
}

/* ---------- navegação de padrões ---------- */
nav ul{list-style:none}
nav button{
  width:100%;
  display:flex;
  gap:9px;
  align-items:flex-start;
  text-align:left;
  background:none;
  border:0;
  border-bottom:1px solid var(--line);
  padding:10px 12px;
  font:inherit;
  font-size:13px;
  color:var(--ink);
  cursor:pointer;
  border-left:3px solid transparent;
}
nav li:last-child button{border-bottom:0}
nav button:hover{background:#F5F8FB}
nav button .num{
  font-family:var(--mono);
  font-size:11px;
  color:var(--ink-60);
  padding-top:2px;
  min-width:16px;
}
nav button[aria-current="true"]{
  background:#F0F5FA;
  border-left-color:var(--orange);
  font-weight:600;
}
nav button[aria-current="true"] .num{color:var(--orange-dk)}

/* ---------- formulário ---------- */
.form-head{
  padding:11px 14px;
  border-bottom:1px solid var(--line);
}
.form-head h2{
  font-size:14px;
  font-weight:600;
  color:var(--navy-800);
}
.form-head p{
  font-size:12px;
  color:var(--ink-60);
  margin-top:2px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 14px;
  padding:14px;
}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo.wide{grid-column:1 / -1}
.campo label{
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.07em;
  text-transform:uppercase;
  color:var(--ink-60);
}
input,select{
  font:inherit;
  font-size:13.5px;
  height:32px;
  padding:0 8px;
  border:1px solid var(--line);
  border-radius:2px;
  background:#FCFDFE;
  color:var(--ink);
  width:100%;
  min-width:0;
}
select{padding-left:5px;cursor:pointer}
input:hover,select:hover{border-color:#A8B6C4}
input:focus,select:focus{
  outline:2px solid var(--orange);
  outline-offset:-1px;
  border-color:var(--orange);
  background:#fff;
}
input.ok,select.ok{border-left:3px solid var(--green)}
.barra{
  display:flex;
  gap:8px;
  align-items:center;
  padding:10px 14px;
  border-top:1px solid var(--line);
  background:#F7F9FB;
  flex-wrap:wrap;
}
button.acao{
  font:inherit;
  font-size:12px;
  font-weight:600;
  letter-spacing:.04em;
  height:30px;
  padding:0 14px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);
  border-radius:2px;
  cursor:pointer;
}
button.acao:hover{background:#EDF1F5}
.dica{
  font-size:11px;
  color:var(--ink-60);
  font-family:var(--mono);
  margin-left:auto;
}

/* ---------- saída ---------- */
.saida-wrap{position:sticky;top:14px}
#saida{
  background:var(--navy-900);
  color:#C9D6E4;
  font-family:var(--mono);
  font-size:13px;
  line-height:1.75;
  padding:14px;
  min-height:190px;
  white-space:pre-wrap;
  word-break:break-word;
  border-bottom:1px solid var(--line);
}
#saida .fixo{color:#EAF2FA;font-weight:700}
#saida .val{color:#FFB05E;font-weight:500}
#saida .pend{
  color:#63788E;
  border-bottom:1px dashed #3C566E;
  cursor:pointer;
}
#saida .pend:hover{color:#9FB4C9}
.status{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  font-size:11.5px;
  font-family:var(--mono);
  color:var(--ink-60);
  border-bottom:1px solid var(--line);
  background:#F7F9FB;
}
.status .pt{color:var(--amber);font-weight:700}
.status .ok{color:var(--green);font-weight:700}
#copiar{
  display:block;
  width:100%;
  border:0;
  border-radius:0 0 2px 2px;
  background:var(--orange);
  color:#fff;
  font:inherit;
  font-size:13px;
  font-weight:700;
  letter-spacing:.09em;
  text-transform:uppercase;
  height:44px;
  cursor:pointer;
  transition:background .12s ease;
}
#copiar:hover{background:var(--orange-dk)}
#copiar.feito{background:var(--green)}
#copiar:focus-visible{outline:2px solid var(--navy-800);outline-offset:-3px}

footer{
  padding:6px 18px 18px;
  font-size:11px;
  color:var(--ink-60);
  letter-spacing:.03em;
}

@media (max-width:1100px){
  main{grid-template-columns:1fr}
  .saida-wrap{position:static}
  nav ul{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  nav button{border-bottom:1px solid var(--line)}
}
@media (max-width:640px){
  .grid{grid-template-columns:1fr}
  header .rel{width:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- seleção de mensagens ---------- */
.chips{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  padding:10px 14px;
  border-bottom:1px solid var(--line);
  background:#F7F9FB;
  align-items:center;
}
.chips .rot{
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.07em;
  text-transform:uppercase;
  color:var(--ink-60);
  margin-right:2px;
}
.chip{
  font:inherit;
  font-size:12px;
  height:26px;
  padding:0 11px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink-60);
  border-radius:13px;
  cursor:pointer;
}
.chip:hover{border-color:#A8B6C4}
.chip[aria-pressed="true"]{
  background:var(--navy-800);
  border-color:var(--navy-800);
  color:#fff;
  font-weight:600;
}

/* ---------- abas de saída ---------- */
.abas{
  display:flex;
  overflow-x:auto;
  border-bottom:1px solid var(--line);
  background:#F7F9FB;
}
.abas button{
  font:inherit;
  font-size:12px;
  white-space:nowrap;
  padding:8px 12px;
  border:0;
  border-bottom:2px solid transparent;
  background:none;
  color:var(--ink-60);
  cursor:pointer;
}
.abas button:hover{background:#EDF1F5}
.abas button[aria-selected="true"]{
  color:var(--navy-800);
  font-weight:700;
  border-bottom-color:var(--orange);
  background:#fff;
}
.abas .marca{
  display:inline-block;
  width:6px;height:6px;
  border-radius:50%;
  background:var(--amber);
  margin-left:6px;
  vertical-align:middle;
}
.abas .marca.ok{background:var(--green)}
.link-saida{
  font:inherit;
  font-size:11.5px;
  background:none;
  border:0;
  color:var(--navy-700);
  text-decoration:underline;
  cursor:pointer;
  margin-left:auto;
  padding:0;
}
.status .link-saida{margin-left:auto}
</style>
</head>
<body>

<header>
  <h1>Gerador de Ocorrências</h1>
  <span class="sub">COI &bull; Energisa Tocantins</span>
  <span class="rel" id="relogio"></span>
</header>

<main>
  <nav class="card" aria-label="Eventos">
    <h2>Evento</h2>
    <ul id="lista-eventos"></ul>
  </nav>

  <section class="card">
    <div class="form-head">
      <h2 id="titulo-evento"></h2>
      <p id="desc-evento"></p>
    </div>
    <div class="chips" id="chips"><span class="rot">Mensagens</span></div>
    <div class="grid" id="grid-campos"></div>
    <div class="barra">
      <button class="acao" id="limpar" type="button">Limpar campos</button>
      <span class="dica">Alt+1..5 troca evento &bull; Ctrl+Enter copia</span>
    </div>
  </section>

  <section class="card saida-wrap">
    <div class="abas" id="abas" role="tablist"></div>
    <div id="saida" aria-live="polite"></div>
    <div class="status" id="status"></div>
    <button id="copiar" type="button">Copiar mensagem</button>
  </section>
</main>

<footer>App Desenvolvido por Rafael Marques - Técnico de Operação do Sistema I</footer>

<script>
"use strict";

/* ====================================================================
   FORMATADORES
   ==================================================================== */
function FMT_DATAHORA(v){                 // 2026-08-19T08:32 -> 19/08/2026 08:32
  const a = v.split("T"); if (a.length < 2) return v;
  const d = a[0].split("-");
  return d[2] + "/" + d[1] + "/" + d[0] + " " + a[1].slice(0,5);
}

/* ====================================================================
   LISTAS
   ==================================================================== */
const PROTECOES = ["50","51","50N","51N","50/51","50N/51N","67","67N","46","27","59","81","79 - bloqueio","Sobrecorrente instantânea","Sobrecorrente temporizada"];
const CAUSAS    = ["Descarga atmosférica","Vegetação","Vento forte","Animal","Terceiros","Falha de equipamento","Queimada","Objeto sobre a rede","Poste abalroado","Trafo queimado","Indeterminada"];
const CLIMAS    = ["Bom","Nublado","Chuva fraca","Chuva forte","Chuva com descargas atmosféricas","Vento forte","Tempo seco"];
const ELOS      = ["1H","2H","3H","5H","8H","6K","10K","15K","25K","40K","65K","80K","100K","140K","200K"];
const NIX       = ["Sim","Não","Parcial"];
const RISCOS    = ["Condutor rompido ao solo","Poste abalroado","Poste danificado","Incêndio próximo à rede","Vazamento de óleo em transformador","Rede com risco de contato","Solicitação de equipe em campo","Acidente com terceiros"];

/* ====================================================================
   CAMPOS REUTILIZÁVEIS
   Um campo declarado aqui é o mesmo dado em todas as mensagens do evento.
   ==================================================================== */
const F = {
  ativo:        {k:"ativo",        rot:"Ativo",                  tipo:"text",     ph:"XXXXX"},
  protecao:     {k:"protecao",     rot:"Proteção atuada",        tipo:"lista",    ph:"XXXXX", opcoes:PROTECOES, padrao:"N/A"},
  icc:          {k:"icc",          rot:"ICC",                    tipo:"text",     ph:"XXXXX", padrao:"N/A"},
  fase:         {k:"fase",         rot:"Fase",                   tipo:"select",   ph:"XXXXX", opcoes:["A","B","C","AB","AC","BC","ABC"]},
  eloret:       {k:"eloret",       rot:"Elo retirado",           tipo:"lista",    ph:"XXXXX", opcoes:ELOS},
  eloinst:      {k:"eloinst",      rot:"Elo instalado",          tipo:"lista",    ph:"XXXXX", opcoes:ELOS},
  risco:        {k:"risco",        rot:"Situação de risco",      tipo:"lista",    ph:"XXXXX", opcoes:RISCOS, largo:true},
  rdr:          {k:"rdr",          rot:"RDR / RDU",              tipo:"text",     ph:"XXXXX"},
  localidade:   {k:"localidade",   rot:"Localidade",             tipo:"text",     ph:"XXXXX"},
  quadra:       {k:"quadra",       rot:"Quadra",                 tipo:"text",     ph:"XXX"},
  clima:        {k:"clima",        rot:"Clima",                  tipo:"lista",    ph:"XXXXX", opcoes:CLIMAS},
  causa:        {k:"causa",        rot:"Causa",                  tipo:"lista",    ph:"XXXXX", opcoes:CAUSAS},
  equipe:       {k:"equipe",       rot:"Equipe",                 tipo:"text",     ph:"XXXXX"},
  polo:         {k:"polo",         rot:"Polo",                   tipo:"text",     ph:"XXXX"},
  local:        {k:"local",        rot:"Local",                  tipo:"text",     ph:"XXXX"},
  interv:       {k:"interv",       rot:"Interv / O.S.",          tipo:"text",     ph:"XXXX"},
  inicio:       {k:"inicio",       rot:"Horário de início",      tipo:"datahora", ph:"XX/XX/XXXX XX:XX", fmt:FMT_DATAHORA},
  parcial:      {k:"parcial",      rot:"Horário da parcial",     tipo:"datahora", ph:"XX/XX/XXXX XX:XX", fmt:FMT_DATAHORA},
  fim:          {k:"fim",          rot:"Horário final",          tipo:"datahora", ph:"XX/XX/XXXX XX:XX", fmt:FMT_DATAHORA},
  interrompidos:{k:"interrompidos",rot:"Clientes interrompidos", tipo:"text",     ph:"XXX"},
  normalizados: {k:"normalizados", rot:"Clientes normalizados",  tipo:"text",     ph:"XXX"},
  cidades:      {k:"cidades",      rot:"Cidades afetadas",       tipo:"text",     ph:"XXX", largo:true},
  nix:          {k:"nix",          rot:"Nix assertivo",          tipo:"lista",    ph:"XXX", opcoes:NIX,
                 cond:v => v.tipo !== "TR", padrao:"N/A"},
  situacao:     {k:"situacao",     rot:"Situação",               tipo:"select",   ph:"XXXXX", opcoes:["Aberto","Desarmado"]},
  obs:          {k:"obs",          rot:"Observação",             tipo:"text",     ph:"XXXXX", largo:true}
};

/* Blocos de mensagem reaproveitados entre eventos.
   O trecho {elemento} é montado pelo próprio evento. */
function divulgacao(linhasElemento, comProtecao){
  let t = ["!Ocorrência em Andamento Polo {polo}","","Local: {local}"]
    .concat(linhasElemento)
    .concat(["Interv/O.S: {interv}",
             "Horário de Início: {inicio}",
             "Quantidade de Clientes Interrompidos: {interrompidos} UC(s)"]);
  if (comProtecao) t = t.concat(["ICC: {icc}","Proteções: {protecao}"]);
  return t.concat(["Causa: {causa}",
                   "Equipe: {equipe}",
                   "Cidades afetadas: {cidades}",
                   "Nix Assertivo: {nix}",
                   "Observação: {obs}"]).join("\n");
}
function parcial(linhasElemento){
  return ["!Atualização de Ocorrência em Andamento Polo {polo}","","Local: {local}"]
    .concat(linhasElemento)
    .concat(["Interv/O.S: {interv}",
             "Horário de Início: {inicio}",
             "Horário da Parcial: {parcial}",
             "Quantidade de clientes normalizados: {normalizados} UC(s)",
             "Quantidade de Clientes Interrompidos: {interrompidos} UC(s)",
             "Nix Assertivo: {nix}",
             "OBS: {obs}"]).join("\n");
}
function final(linhasElemento){
  return ["!Atualização de Ocorrência Polo {polo}","","Local: {local}"]
    .concat(linhasElemento)
    .concat(["Interv/O.S: {interv}",
             "Horário de Início: {inicio}",
             "Horário Final: {fim}",
             "Nix Assertivo: {nix}",
             "Causa: {causa}",
             "Observação: {obs}"]).join("\n");
}

/* Remove do template as linhas de um campo que nao se aplica ao evento. */
function sem(template, chave){
  return template.split("\n").filter(l => l.indexOf("{"+chave+"}") < 0).join("\n");
}
/* Copia a definicao de um campo trocando alguma propriedade so neste evento. */
function variante(campo, extras){
  return Object.assign({}, campo, extras);
}

const DIVULG_COMUNS = [F.polo,F.local,F.interv,F.inicio,F.interrompidos,F.cidades,F.nix];
const ATUALIZ_COMUNS = [F.parcial,F.normalizados,F.fim];

/* ====================================================================
   EVENTOS
   ==================================================================== */
const EVENTOS = [
  {
    id:"desarme",
    nome:"Desarme de DJ / Religador",
    desc:"Atuação de proteção com desligamento de alimentador ou religador de linha.",
    campos:[
      {k:"tipo", rot:"Equipamento", tipo:"select", ph:"DJ/RL", opcoes:["DJ","RL"], gatilho:true},
      F.ativo, F.protecao, F.icc, F.causa, F.equipe, F.clima, F.rdr, F.localidade
    ].concat(DIVULG_COMUNS, ATUALIZ_COMUNS, [F.obs]),
    saidas:[
      {id:"interv", nome:"Intervenção", template:[
        "!Desarme {tipo} {ativo}",
        "Proteção atuada {protecao}",
        "ICC {icc}",
        "Penalizando cargas da RDR/RDU {rdr}",
        "Localidade {localidade}",
        "Causa {causa}",
        "Equipe {equipe}",
        "Clima {clima}",
        "OBS: {obs}"
      ].join("\n")},
      {id:"divulg",  nome:"Divulgação",  template:divulgacao(["Elemento desarmado: {tipo} {ativo}"], true)},
      {id:"parcial", nome:"Parcial",     template:parcial(["Elemento desarmado: {tipo} {ativo}"])},
      {id:"final",   nome:"Final",       template:final(["Elemento desarmado: {tipo} {ativo}"])}
    ]
  },
  {
    id:"elo",
    nome:"Queima de elo - Trafo / Chave",
    desc:"Atuação de elo fusível em transformador ou chave de derivação.",
    campos:[
      {k:"tipo", rot:"Equipamento", tipo:"select", ph:"TR/CH", opcoes:["TR","CH"], gatilho:true},
      F.ativo, F.fase, F.eloret, F.eloinst, F.causa, F.equipe, F.clima, F.rdr, F.localidade, F.quadra
    ].concat(DIVULG_COMUNS.filter(c => c.k !== "nix"), ATUALIZ_COMUNS, [F.obs]),
    derivados:{ artigo:v => v.tipo === "CH" ? "na" : (v.tipo === "TR" ? "no" : "no(a)") },
    saidas:[
      {id:"interv", nome:"Intervenção", template:[
        "!Queima de elo {artigo} {tipo} {ativo}",
        "Fase {fase} Elo Retirado {eloret} Elo Instalado {eloinst}",
        "Penalizando cargas da RDR/RDU {rdr}",
        "Localidade {localidade}",
        "Quadra {quadra}",
        "Causa {causa}",
        "Equipe {equipe}",
        "Clima {clima}",
        "OBS: {obs}"
      ].join("\n")},
      {id:"divulg",  nome:"Divulgação",  template:sem(divulgacao(["Elemento desarmado: {tipo} {ativo}","Quadra: {quadra}","Fase {fase} - elo retirado {eloret}, elo instalado {eloinst}"], false), "nix")},
      {id:"parcial", nome:"Parcial",     template:sem(parcial(["Elemento desarmado: {tipo} {ativo}","Quadra: {quadra}"]), "nix")},
      {id:"final",   nome:"Final",       template:sem(final(["Elemento desarmado: {tipo} {ativo}","Quadra: {quadra}"]), "nix")}
    ]
  },
  {
    id:"emergencial",
    nome:"Abertura emergencial",
    desc:"Manobra emergencial por situação de risco em campo.",
    campos:[
      {k:"tipo", rot:"Equipamento", tipo:"select", ph:"DJ/RL/TR/CH", opcoes:["DJ","RL","TR","CH"], gatilho:true},
      F.ativo, F.risco, F.causa, F.equipe, F.clima, F.rdr, F.localidade
    ].concat(DIVULG_COMUNS.map(c => c.k === "nix" ? variante(c, {cond:v => v.tipo === "CH"}) : c), ATUALIZ_COMUNS, [F.obs]),
    saidas:[
      {id:"interv", nome:"Intervenção", template:[
        "!Abertura emergencial {tipo} {ativo}",
        "Devido situação de risco: {risco}",
        "Penalizando cargas da RDR/RDU {rdr}",
        "Localidade {localidade}",
        "Causa {causa}",
        "Equipe {equipe}",
        "Clima {clima}",
        "OBS: {obs}"
      ].join("\n")},
      {id:"divulg",  nome:"Divulgação",  template:divulgacao(["Elemento desarmado: {tipo} {ativo}","Situação de risco: {risco}"], false)},
      {id:"parcial", nome:"Parcial",     template:parcial(["Elemento desarmado: {tipo} {ativo}"])},
      {id:"final",   nome:"Final",       template:final(["Elemento desarmado: {tipo} {ativo}"])}
    ]
  },
  {
    id:"trafo",
    nome:"Trafo de distribuição",
    desc:"Transformador de distribuição aberto ou desarmado. Nix assertivo não se aplica.",
    campos:[
      F.ativo, F.situacao, F.causa, F.equipe, F.clima, F.rdr, F.localidade, F.quadra,
      F.polo, F.local, F.interv, F.inicio, F.interrompidos,
      F.parcial, F.normalizados, F.fim, F.obs
    ],
    saidas:[
      {id:"interv", nome:"Intervenção", template:[
        "!Trafo de distribuição {situacao} TR {ativo}",
        "Penalizando cargas da RDR/RDU {rdr}",
        "Localidade {localidade}",
        "Quadra {quadra}",
        "Causa {causa}",
        "Equipe {equipe}",
        "Clima {clima}",
        "OBS: {obs}"
      ].join("\n")},
      {id:"divulg", nome:"Divulgação", template:[
        "!Ocorrência em Andamento Polo {polo}",
        "",
        "Local: {local}",

      ].join("\n")},

        "",

      {id:"final", nome:"Final", template:[

  },
  {

    campos:[
      {k:"regional",   rot:"Regional",            tipo:"lista",  ph:"XXXX", opcoes:["Norte","Centro","Sul"]},
      {k:"dj",         rot:"DJ",                  tipo:"text",   ph:"XXX"},
      {k:"nivel",      rot:"Lado",                tipo:"select", ph:"Alta/Baixa", opcoes:["Alta","Baixa"]},
      {k:"trafo",      rot:"Trafo (kV)",          tipo:"text",   ph:"XXX/XXX"},
      {k:"se",         rot:"Subestação",          tipo:"text",   ph:"XXXX"},
      {k:"unidades",   rot:"Unidades afetadas",   tipo:"text",   ph:"X.XXX"},
      F.protecao,

    ],

        "!Abrangência: Regional {regional}",

        "!Denominação: Desarme DJ {dj} ({nivel}) do Trafo {trafo} kV SE {se}.",
        "Unidades Afetados: {unidades}",
        "Proteção: {protecao}",
        "Horário Inicial: {hini}",
        "Horário final: {hfim}",

      ].join("\n")}

];

/* ====================================================================
   ESTADO
   ==================================================================== */
const valores = {};      // valores[evento][campo]
const marcadas = {};     // marcadas[evento] = [idsDeSaida]
const abaAtiva = {};     // abaAtiva[evento] = idDeSaida
EVENTOS.forEach(e => {
  valores[e.id]  = {};
  marcadas[e.id] = e.saidas.slice(0, Math.min(2, e.saidas.length)).map(s => s.id);
  abaAtiva[e.id] = marcadas[e.id][0];
});
let atual = EVENTOS[0];

const get = k => valores[atual.id][k] || "";
const set = (k,v) => { valores[atual.id][k] = v; };
const selecionadas = () => atual.saidas.filter(s => marcadas[atual.id].indexOf(s.id) >= 0);
const saidaAtiva   = () => atual.saidas.find(s => s.id === abaAtiva[atual.id]) || selecionadas()[0];

/* ====================================================================
   NAVEGAÇÃO DE EVENTOS
   ==================================================================== */
const lista = document.getElementById("lista-eventos");
EVENTOS.forEach((e,i) => {
  const li = document.createElement("li");
  const b  = document.createElement("button");
  b.type = "button";
  b.innerHTML = '<span class="num">' + String(i+1).padStart(2,"0") + '</span><span>' + e.nome + '</span>';
  b.onclick = () => selecionar(e);
  li.appendChild(b);
  lista.appendChild(li);
  e._btn = b;
});

function selecionar(e){
  atual = e;
  EVENTOS.forEach(x => x._btn.setAttribute("aria-current", x === e ? "true" : "false"));
  document.getElementById("titulo-evento").textContent = e.nome;
  document.getElementById("desc-evento").textContent   = e.desc;
  montarChips();
  montarCampos();
  render();
}

/* ====================================================================
   SELEÇÃO DE MENSAGENS
   ==================================================================== */
const chips = document.getElementById("chips");

function montarChips(){
  chips.querySelectorAll(".chip").forEach(c => c.remove());
  chips.parentNode.querySelector(".chips").style.display = atual.saidas.length > 1 ? "flex" : "none";
  atual.saidas.forEach(s => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = s.nome;
    b.setAttribute("aria-pressed", marcadas[atual.id].indexOf(s.id) >= 0 ? "true" : "false");
    b.onclick = () => alternar(s.id);
    chips.appendChild(b);
  });
}

function alternar(id){
  const m = marcadas[atual.id];
  const i = m.indexOf(id);
  if (i >= 0){
    if (m.length === 1) return;          // mantém ao menos uma mensagem
    m.splice(i,1);
    if (abaAtiva[atual.id] === id) abaAtiva[atual.id] = m[0];
  } else {
    // preserva a ordem de declaração das saídas
    m.push(id);
    m.sort((a,b) => atual.saidas.findIndex(s => s.id===a) - atual.saidas.findIndex(s => s.id===b));
  }
  montarChips();
  montarCampos();
  render();
}

/* ====================================================================
   FORMULÁRIO
   Só aparecem os campos usados pelas mensagens marcadas.
   ==================================================================== */
const grid = document.getElementById("grid-campos");
const refs = {};

function brutos(){
  const v = {};
  atual.campos.forEach(c => { v[c.k] = get(c.k); });
  return v;
}

function camposVisiveis(){
  const sel = selecionadas();
  const v = brutos();
  return atual.campos.filter(c => {
    const alvo = c.controla || c.k;          // campo de controle segue o campo que comanda
    const usado = sel.some(s => s.template.indexOf("{"+alvo+"}") >= 0);
    return usado && (!c.cond || c.cond(v));
  });
}

function montarCampos(){
  grid.innerHTML = "";
  for (const k in refs) delete refs[k];

  camposVisiveis().forEach(c => {
    const box = document.createElement("div");
    box.className = "campo" + (c.largo ? " wide" : "");
    const id  = "f_" + c.k;

    const lab = document.createElement("label");
    lab.textContent = c.rot;
    lab.setAttribute("for", id);
    box.appendChild(lab);

    let el;
    if (c.tipo === "select"){
      el = document.createElement("select");
      const vazio = document.createElement("option");
      vazio.value = ""; vazio.textContent = "-- selecionar --";
      el.appendChild(vazio);
      c.opcoes.forEach(o => {
        const op = document.createElement("option");
        op.value = o; op.textContent = o;
        el.appendChild(op);
      });
    } else if (c.tipo === "hora" || c.tipo === "datahora"){
      el = document.createElement("input");
      el.type = (c.tipo === "hora") ? "time" : "datetime-local";
      if (c.tipo === "hora") el.step = "1";
    } else {
      el = document.createElement("input");
      el.type = "text";
      el.autocomplete = "off";
      el.placeholder = c.ph;
      if (c.tipo === "lista"){
        const dl = document.createElement("datalist");
        dl.id = "dl_" + c.k;
        c.opcoes.forEach(o => {
          const op = document.createElement("option");
          op.value = o;
          dl.appendChild(op);
        });
        box.appendChild(dl);
        el.setAttribute("list", dl.id);
      }
    }

    el.id = id;
    el.value = get(c.k);
    const gatilho = !!c.controla || !!c.gatilho;   // muda quais campos aparecem
    const atualizar = () => {
      set(c.k, el.value.trim());
      if (gatilho) montarCampos();                 // reconstrói a lista de campos
      render();
    };
    el.addEventListener("input", atualizar);
    el.addEventListener("change", atualizar);

    box.appendChild(el);
    grid.appendChild(box);
    refs[c.k] = el;
  });
}

/* ====================================================================
   MONTAGEM DAS MENSAGENS
   ==================================================================== */
function contexto(){
  const cru = brutos();
  const v = {};
  atual.campos.forEach(c => {
    const oculto = c.cond && !c.cond(cru);
    let bruto = oculto ? "" : cru[c.k];
    if (!oculto && !bruto && c.padrao) bruto = c.padrao;   // ICC, Proteções e Nix saem como N/A
    v[c.k] = (c.fmt && bruto) ? c.fmt(bruto) : bruto;
  });
  if (atual.derivados){
    for (const d in atual.derivados) v[d] = atual.derivados[d](v);
  }
  return v;
}

/* Uma linha só entra na mensagem se ao menos um dos seus campos estiver
   preenchido. Linhas iniciadas por "!" são fixas e sempre aparecem. */
function corpo(saidaObj, v){
  return saidaObj.template.split("\n").filter(linha => {
    if (linha.charAt(0) === "!") return true;
    const chaves = (linha.match(/\{([a-zA-Z]+)\}/g) || [])
      .map(m => m.slice(1,-1))
      .filter(k => atual.campos.some(c => c.k === k));
    if (!chaves.length) return true;
    return chaves.some(k => !!v[k]);
  }).map(l => l.charAt(0) === "!" ? l.slice(1) : l).join("\n");
}

function segmentos(saidaObj, v){
  return corpo(saidaObj, v).split(/(\{[a-zA-Z]+\})/g).filter(s => s !== "").map(s => {
    const m = s.match(/^\{([a-zA-Z]+)\}$/);
    if (!m) return {tipo:"texto", txt:s};
    const chave = m[1];
    const campo = atual.campos.find(c => c.k === chave);
    if (!campo) return {tipo:"texto", txt:v[chave] || ""};
    return {tipo: v[chave] ? "valor" : "pendente", txt: v[chave] || campo.ph, k:chave, rot:campo.rot};
  });
}

const texto = (saidaObj, v) => segmentos(saidaObj, v).map(s => s.txt).join("");

const esc = t => t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* Texto fixo em negrito; valores preenchidos em peso normal. */
function html(saidaObj, v){
  return segmentos(saidaObj, v).map(s => {
    const t = esc(s.txt).replace(/\n/g,"<br>");
    return s.tipo === "texto" ? "<b>" + t + "</b>" : t;
  }).join("");
}
function envelope(corpoHtml){
  return '<div style="font-family:Segoe UI,Arial,sans-serif;font-size:14px;white-space:pre-wrap">'
       + corpoHtml + '</div>';
}

/* WhatsApp não aceita colagem formatada: usa marcação por asteriscos. */
function whatsapp(saidaObj, v){
  return segmentos(saidaObj, v).map(s => {
    if (s.tipo !== "texto") return s.txt;
    return s.txt.split("\n").map(linha => {
      const m = linha.match(/^(\s*)([\s\S]*?)(\s*)$/);
      if (!m || !m[2] || !/[0-9A-Za-zÀ-ÿ]/.test(m[2])) return linha;
      return m[1] + "*" + m[2] + "*" + m[3];
    }).join("\n");
  }).join("");
}
const pendentesDe = (saidaObj, v) => segmentos(saidaObj, v).filter(s => s.tipo === "pendente").length;

/* ====================================================================
   RENDERIZAÇÃO
   ==================================================================== */
const abas   = document.getElementById("abas");
const saida  = document.getElementById("saida");
const status = document.getElementById("status");
const btn    = document.getElementById("copiar");

function render(){
  const v   = contexto();
  const sel = selecionadas();
  if (sel.indexOf(saidaAtiva()) < 0) abaAtiva[atual.id] = sel[0].id;
  const ativa = saidaAtiva();

  // abas
  abas.innerHTML = "";
  sel.forEach(s => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected", s === ativa ? "true" : "false");
    const p = pendentesDe(s, v);
    b.innerHTML = s.nome + '<span class="marca' + (p === 0 ? " ok" : "") + '"></span>';
    b.title = p === 0 ? "Completa" : p + " campo(s) pendente(s)";
    b.onclick = () => { abaAtiva[atual.id] = s.id; render(); };
    abas.appendChild(b);
  });
  if (sel.length > 1){
    const t = document.createElement("button");
    t.type = "button";
    t.className = "link-saida";
    t.textContent = "Copiar todas";
    t.onclick = copiarTodas;
    abas.appendChild(t);
  }

  // corpo da mensagem
  saida.innerHTML = "";
  let pend = 0;
  segmentos(ativa, v).forEach(s => {
    const sp = document.createElement("span");
    if (s.tipo === "texto"){
      sp.className = "fixo";
      sp.textContent = s.txt;
      saida.appendChild(sp);
      return;
    }
    sp.textContent = s.txt;
    if (s.tipo === "valor"){
      sp.className = "val";
    } else {
      sp.className = "pend";
      sp.title = "Preencher: " + s.rot;
      sp.onclick = () => { if (refs[s.k]) refs[s.k].focus(); };
      pend++;
    }
    saida.appendChild(sp);
  });

  camposVisiveis().forEach(c => { if (refs[c.k]) refs[c.k].classList.toggle("ok", !!get(c.k)); });

  status.innerHTML = pend === 0
    ? '<span class="ok">COMPLETO</span> ' + ativa.nome + ' pronta para envio.'
    : '<span class="pt">' + pend + ' PENDENTE' + (pend>1?"S":"") + '</span> Clique no campo em destaque para preencher.';

  const wpp = document.createElement("button");
  wpp.type = "button";
  wpp.className = "link-saida";
  wpp.textContent = "Copiar para WhatsApp";
  wpp.title = "Aplica asteriscos no lugar do negrito";
  wpp.onclick = copiarWhatsapp;
  status.appendChild(wpp);

  btn.classList.remove("feito");
  btn.textContent = "Copiar " + ativa.nome.toLowerCase();
}

/* ====================================================================
   CÓPIA
   ==================================================================== */
function confirmar(rotulo){
  btn.classList.add("feito");
  btn.textContent = rotulo;
  setTimeout(render, 1600);
}

/* 1) area de transferencia rica (Teams, Outlook, Word)
   2) contenteditable + execCommand, quando a API rica nao existe
   3) texto puro, ultimo recurso */
function copiarRico(corpoHtml, plano, rotulo){
  const doc = envelope(corpoHtml);
  const viaSelecao = () => {
    const d = document.createElement("div");
    d.contentEditable = "true";
    d.innerHTML = doc;
    d.style.position = "fixed"; d.style.left = "-9999px"; d.style.top = "0";
    document.body.appendChild(d);
    const r = document.createRange(); r.selectNodeContents(d);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch(e){}
    sel.removeAllRanges(); d.remove();
    if (ok) confirmar(rotulo); else copiarPlano(plano, rotulo);
  };
  if (navigator.clipboard && window.ClipboardItem && window.isSecureContext){
    try {
      navigator.clipboard.write([new ClipboardItem({
        "text/html":  new Blob([doc],   {type:"text/html"}),
        "text/plain": new Blob([plano], {type:"text/plain"})
      })]).then(() => confirmar(rotulo)).catch(viaSelecao);
      return;
    } catch(e){ viaSelecao(); return; }
  }
  viaSelecao();
}
function copiarPlano(t, rotulo){
  const legado = () => {
    const ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); confirmar(rotulo); } catch(e){}
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(() => confirmar(rotulo)).catch(legado);
  } else { legado(); }
}
function copiar(){
  const v = contexto(), a = saidaAtiva();
  copiarRico(html(a, v), texto(a, v), "Mensagem copiada");
}
function copiarTodas(){
  const v = contexto(), sel = selecionadas();
  copiarRico(sel.map(s => html(s, v)).join("<br><br>----------<br><br>"),
             sel.map(s => texto(s, v)).join("\n\n----------\n\n"),
             "Todas copiadas");
}
function copiarWhatsapp(){
  const v = contexto();
  copiarPlano(whatsapp(saidaAtiva(), v), "Copiada para WhatsApp");
}
btn.onclick = copiar;

document.getElementById("limpar").onclick = () => {
  valores[atual.id] = {};
  montarCampos();
  render();
  const vis = camposVisiveis();
  if (vis.length && refs[vis[0].k]) refs[vis[0].k].focus();
};

/* ====================================================================
   ATALHOS E RELÓGIO
   ==================================================================== */
document.addEventListener("keydown", e => {
  if (e.ctrlKey && e.key === "Enter"){ e.preventDefault(); copiar(); return; }
  if (e.altKey && !e.ctrlKey){
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= EVENTOS.length){ e.preventDefault(); selecionar(EVENTOS[n-1]); }
  }
});

function relogio(){
  const d = new Date(), p = n => String(n).padStart(2,"0");
  document.getElementById("relogio").textContent =
    p(d.getDate()) + "/" + p(d.getMonth()+1) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
relogio();
setInterval(relogio, 20000);

selecionar(EVENTOS[0]);
</script>
